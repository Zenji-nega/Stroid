[package]
name = "stroid-jni"
description = "JNI bridge exposing stroid-core to the Android app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Produces libstroid_jni.so, loaded from Kotlin with System.loadLibrary("stroid_jni").
name = "stroid_jni"
crate-type = ["cdylib"]

[dependencies]
stroid-core = { path = "../stroid-core" }
jni = "0.21"
